services:
  backend:
    build: .
    env_file: .env
    # Override REDIS_URL/DATABASE_URL for CONTAINER-to-container traffic: .env's
    # "localhost:6379"/"localhost:5432" are correct for running uvicorn directly
    # on the host against these same containers' port-mapped ports, but inside
    # the backend container "localhost" means the container itself — it must
    # address the other services by their compose service name instead.
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://voiceagent:voiceagent@postgres:5432/voiceagent
      # Passed straight through from .env (empty if unset). NOT hardcoded to a
      # tunnel hostname any more: quick tunnels get a new random name on every
      # start, so a baked-in default is guaranteed to rot — it used to point at
      # a tunnel that had been dead for days, which read as a broken app.
      #
      # scripts/resolve_public_url.sh decides the effective value at startup:
      # a reachable PUBLIC_BASE_URL wins, otherwise it asks the cloudflared
      # service below for the tunnel it is currently serving.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TUNNEL_DISCOVERY_URL: http://cloudflared:20241
    # Resolve DNS through Cloudflare's own resolver, NOT Docker's default.
    #
    # This fixes a recurring, misleading failure: preflight would report
    # "PUBLIC_BASE_URL (…trycloudflare.com) is unreachable" even though the
    # tunnel was up and globally resolvable. Root cause was DNS, not the
    # tunnel — Docker's embedded resolver (127.0.0.11, forwarding to the host)
    # negative-caches each freshly-minted quick-tunnel subdomain and keeps
    # returning NXDOMAIN for minutes, while the parent trycloudflare.com and
    # every other host resolve fine. Since the tunnel's DNS is Cloudflare's,
    # asking 1.1.1.1 directly always has the fresh record the instant
    # cloudflared mints it. Verified 2026-07-23: same URL, Docker resolver
    # 000/NXDOMAIN vs 1.1.1.1 -> 200.
    dns: ["1.1.1.1", "1.0.0.1"]
    # Host port 8091, not 8000: the sibling ai-voice-agent project runs its own
    # server on host:8000 — these are two independent apps and must not collide.
    # Container-internal port stays 8000 (matches the Dockerfile/uvicorn command).
    ports: ["8091:8000"]
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
        required: false   # postgres only runs under the "dev" profile
    restart: unless-stopped
    # Resolves PUBLIC_BASE_URL (see the script's own docstring) and then execs
    # the command below. It must run BEFORE uvicorn because app/config.py reads
    # the variable once at import, and modules bind it by name from there.
    entrypoint: ["/app_root/scripts/resolve_public_url.sh"]
    # Single worker keeps APScheduler single-instance.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  # The public tunnel Plivo needs to reach /calls/answer and /calls/stream.
  #
  # Runs HERE rather than in a terminal someone has to remember to keep open:
  # closing that terminal, or rebooting, silently broke every call, and the
  # only symptom was preflight saying the URL was unreachable. As a compose
  # service it starts with `docker compose up` and comes back on its own.
  #
  # Still a QUICK tunnel — the hostname changes on every restart. That is now
  # harmless because nothing writes it down: the backend's entrypoint asks this
  # container for the current one. For a fixed hostname, move to a NAMED tunnel
  # (needs a domain on a Cloudflare account) and just set PUBLIC_BASE_URL in
  # .env — a reachable value there wins and discovery is skipped.
  cloudflared:
    image: cloudflare/cloudflared:latest
    # --metrics serves /quicktunnel, which is how the backend learns the URL.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://backend:8000
    restart: unless-stopped
    depends_on: [backend]

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped

  # Local dev/test substitute for Supabase Postgres — NOT used in production.
  # Supabase itself is managed cloud (a connection string, not a container); this
  # gives dev/test parity (same schema, same pgvector extension) with zero cloud
  # dependency, until DATABASE_URL is swapped to the real Supabase string.
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["dev"]
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The call worker runs IN-PROCESS inside `backend` by default (a background
  # asyncio task started from app/main.py's lifespan — see config.WORKER_ENABLED)
  # so this service is not needed at the pilot's scale. Uncomment it AND set
  # WORKER_ENABLED=false on `backend` above only to scale call throughput
  # independently of the API/scheduler — BLMOVE's atomic pop makes running
  # both simultaneously safe (just redundant), so this is never required for
  # correctness, only for capacity.
  # worker:
  #   build: .
  #   env_file: .env
  #   environment:
  #     REDIS_URL: redis://redis:6379/0
  #     DATABASE_URL: postgresql://voiceagent:voiceagent@postgres:5432/voiceagent
  #   depends_on: [redis]
  #   command: python -m app.telephony.worker

volumes:
  redis-data:
  postgres-data:
